services:
    laravel-service:
        container_name: laravel-container
        build:
            context: .
            dockerfile: docker/laravel/Dockerfile
        working_dir: /var/www/html
        volumes:
            - ./laravel-app:/var/www/html
            - ./docker/laravel/entrypoint.development.sh:/usr/local/bin/entrypoint.development.sh
            - ./docker/laravel/supervisord.development.conf:/etc/supervisor/conf.d/supervisord.development.conf
        ports:
            - "8000:8000"
        depends_on:
            - mysql-service
            - minio-service
        command: [ "bash", "/usr/local/bin/entrypoint.development.sh" ]

    vuejs-service:
        container_name: vuejs-container
        build:
            context: .
            dockerfile: docker/vuejs/Dockerfile
        working_dir: /app
        volumes:
            - ./vuejs-app:/app
            - ./docker/vuejs/entrypoint.development.sh:/usr/local/bin/entrypoint.development.sh
        ports:
            - "5173:5173"
        depends_on:
            - laravel-service
        command: [ "sh", "/usr/local/bin/entrypoint.development.sh" ]

    mysql-service:
        image: mysql:8.0
        container_name: mysql-container
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-tr_system}
            MYSQL_USER: ${MYSQL_USER:-tr_user}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tr_password}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            TZ: Asia/Phnom_Penh
        volumes:
            - mysql_data:/var/lib/mysql

    minio-service:
        image: pgsty/silo:latest
        container_name: minio-container
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
        volumes:
            - minio_data:/data
        ports:
            - "9000:9000"
            - "9001:9001"
        command: server /data --console-address ":9001"

    minio-create-bucket:
        image: pgsty/silo:latest
        container_name: minio-mc-container
        depends_on:
            - minio-service
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
        entrypoint: >
            /bin/sh -c "
            sleep 3;
            mc alias set localminio http://minio-service:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
            mc mb --ignore-existing localminio/trms-bucket;
            mc anonymous set none localminio/trms-bucket;
            mc mb --ignore-existing localminio/trms-public;
            mc anonymous set download localminio/trms-public;
            exit 0;
            "

    phpmyadmin:
        image: phpmyadmin:5.2.2
        container_name: phpmyadmin-container
        depends_on:
            - mysql-service
        environment:
            UPLOAD_LIMIT: 50M
            PMA_HOST: mysql-service
            PMA_PORT: 3306
            PMA_USER: ${PMA_USER:-root}
            PMA_PASSWORD: ${PMA_PASSWORD:-root}
        ports:
            - "9090:80"
volumes:
    mysql_data:
    minio_data: